alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
databases:
- cluster_name: apps-db-sfo
  db_name: glidehero
  engine: PG
  name: apps-db-sfo
  production: true
- cluster_name: app-valkey-sfo
  engine: VALKEY
  name: app-valkey-sfo
  production: true
  version: "8"
disable_edge_cache: true
domains:
- domain: glidehero.com
  type: PRIMARY
- domain: www.glidehero.com
  type: ALIAS
envs:
- key: VALKEY_URL
  scope: RUN_AND_BUILD_TIME
  value: ${app-valkey-sfo.DATABASE_URL}
- key: BUCKET_FOLDER
  scope: RUN_AND_BUILD_TIME
  value: glidehero
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: glidehero-comp
    match:
      authority:
        exact: ""
      path:
        prefix: /
